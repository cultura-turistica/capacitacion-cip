            --secondary-color: #27AE60;

            --accent-color: #F39C12;

        nav ul {

        nav a {

            color: var(--dark-color);
            font-weight: 600;
            font-size: 1rem;

        }

        nav a:hover {

        }

        .btn {

            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;

            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        }

        .btn-secondary {

        .module-item:hover {

        }

        .module-item.completed {

        .module-number {

            color: var(--primary-color);
            font-weight: 700;
            display: block;
            margin-bottom: 0.3rem;
        }

        .module-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--dark-color);
        }

        .module-status {
            font-size: 0.75rem;
            color: var(--text-color);
            margin-top: 0.3rem;
        }

        /* Main Content */
        .course-content {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
        }

        .content-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--light-color);
        }

        .content-header h1 {
            font-size: 2rem;
            color: var(--dark-color);
            margin-bottom: 0.5rem;
        }

        .content-header p {
            color: var(--text-color);
            font-size: 1.1rem;
        }

        .content-body {
            margin-bottom: 2rem;
        }

        .content-section {
            margin-bottom: 2.5rem;
        }

        .content-section h2 {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            padding-left: 1rem;
            border-left: 4px solid var(--primary-color);
        }

        .content-section h3 {
            font-size: 1.2rem;
            color: var(--dark-color);
            margin: 1.5rem 0 1rem;
        }

        .content-section p {
            margin-bottom: 1rem;

        }

            margin: 1rem 0 1rem 2rem;

            margin-bottom: 0.5rem;

        /* Info Box */
        .info-box {
            background: linear-gradient(135deg, #e8f4f8 0%, #d4edda 100%);
            border-left: 4px solid var(--secondary-color);
            padding: 1.5rem;
            border-radius: 8px;

        }

        .info-box.warning {
            background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%);
            border-left-color: var(--accent-color);
        }

        .info-box.tip {

        .info-box h4 {
            color: var(--dark-color);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;

        }

        /* Example Card */
        .example-card {
            background: linear-gradient(135deg, #fff5e6 0%, #ffe6cc 100%);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin: 1.5rem 0;
            border: 2px solid var(--accent-color);

        .example-card h4 {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-size: 1.2rem;

        .example-card .example-tag {

            background: var(--primary-color);

            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        /* Exercise Box */
        .exercise-box {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: var(--border-radius);
            padding: 2rem;
            margin: 2rem 0;
            border: 2px solid var(--secondary-color);
        }

        .exercise-box h3 {
            color: var(--secondary-color);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .exercise-steps {
            list-style: none;
            counter-reset: exercise-counter;
        }

        .exercise-steps li {
            counter-increment: exercise-counter;
            padding: 1rem 0 1rem 3rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            position: relative;
        }

        .exercise-steps li::before {
            content: counter(exercise-counter);
            position: absolute;
            left: 0;
            top: 1rem;
            width: 2rem;
            height: 2rem;
            background: var(--gradient-secondary);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .exercise-steps li:last-child {
            border-bottom: none;
        }

        /* Navigation Buttons */
        .content-navigation {
            display: flex;
            justify-content: space-between;
            padding-top: 2rem;
            border-top: 2px solid var(--light-color);
            margin-top: 2rem;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
        }

        .nav-btn.prev {
            background: var(--light-color);
            color: var(--dark-color);
        }

        .nav-btn.next {
            background: var(--gradient-primary);
            color: var(--white);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Progress Bar */
        .progress-container {
            background: var(--light-color);
            border-radius: 50px;
            height: 10px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 50px;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 0.9rem;
            color: var(--text-color);
            text-align: right;
        }

        /* Table */
        .content-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            background: var(--white);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .content-table th {
            background: var(--gradient-primary);
            color: var(--white);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }

        .content-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--light-color);
        }

        .content-table tr:hover {
            background: var(--light-color);
        }

        /* Image Container */
        .image-container {
            margin: 2rem 0;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .image-caption {
            background: var(--dark-color);
            color: var(--white);
            padding: 0.8rem;
            text-align: center;
            font-size: 0.9rem;
        }

        /* Quote */
        .quote-box {
            background: var(--light-color);
            border-left: 4px solid var(--primary-color);
            padding: 1.5rem 2rem;
            margin: 1.5rem 0;
            font-style: italic;
            border-radius: 0 8px 8px 0;
        }

        .quote-box cite {
            display: block;
            margin-top: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            font-style: normal;
        }

        /* Completion Badge */
        .completion-badge {
            background: linear-gradient(135deg, #27AE60 0%, #2ECC71 100%);
            color: var(--white);
            padding: 2rem;
            border-radius: var(--border-radius);
            text-align: center;
            margin: 2rem 0;
            display: none;
        }

        .completion-badge.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        .completion-badge h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .completion-badge .badge-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .course-layout {
                grid-template-columns: 1fr;
            }

            .course-sidebar {
                position: relative;
                top: 0;
            }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            .course-content {
                padding: 1.5rem;
            }

            .content-navigation {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-btn {
                justify-content: center;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate {
            animation: fadeInUp 0.6s ease forwards;
        }

        /* Welcome Screen */
        .welcome-screen {
            text-align: center;
            padding: 3rem 0;
        }

        .welcome-screen h1 {
            font-size: 2.5rem;
            color: var(--dark-color);
            margin-bottom: 1.5rem;
        }

        .welcome-screen p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 2rem;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .feature-card {
            background: var(--light-color);
            padding: 2rem;
            border-radius: var(--border-radius);
            text-align: center;
        }

        .feature-card .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .feature-card h4 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
    </style>
</head>

    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">

    <script>
        // Course Data
        const courseData = {
            welcome: {
                title: "Bienvenido al Curso de Diseño de Producto Turístico Territorial",
                subtitle: "Ruta de Fortalecimiento en Turismo Comunitario",
                description: "Este programa de formación está diseñado para emprendedores, líderes comunitarios y gestores turísticos que buscan crear experiencias memorables y sostenibles en sus territorios. A través de 11 módulos prácticos, desarrollarás las capacidades necesarias para diseñar, planificar y comercializar productos turísticos con enfoque comunitario.",
                features: [
                    { icon: "📖", title: "100% Autoguiado", desc: "Estudia a tu propio ritmo, sin presiones de tiempo" },
                    { icon: "🎯", title: "Enfoque Práctico", desc: "Aplica cada módulo directamente en tu iniciativa" },
                    { icon: "🌱", title: "Sostenible", desc: "Aprende a crear productos que respeten tu territorio" },

                ]
            },
            modules: [
                {
                    id: 1,
                    title: "Fundamentos del Producto Turístico",
                    status: "pending",
                    content: `
                        <div class="content-header">
                            <h1>Módulo 1: Fundamentos del Producto Turístico</h1>
                            <p>Comprende qué es un producto turístico y cómo se diferencia de una experiencia turística</p>
                        </div>

                        <div class="content-body">
                            <div class="content-section">
                                <h2>🎯 Objetivos de Aprendizaje</h2>
                                <ul>
                                    <li>Comprender la diferencia entre producto y experiencia turística</li>
                                    <li>Identificar los componentes esenciales de un producto turístico</li>
                                    <li>Entender la analogía del restaurante aplicada al turismo</li>
                                    <li>Reconocer la importancia del enfoque en la demanda</li>
                                </ul>
                            </div>

                            <div class="content-section">
                                <h2>¿Qué es un Producto Turístico?</h2>
                                <p>Un producto turístico es el conjunto de servicios, actividades y experiencias que se ofrecen a los visitantes durante su estancia en un destino. Sin embargo, es crucial entender que <strong>el producto es lo que se vende, pero la experiencia es lo que se recuerda</strong>.</p>

                                <div class="info-box">
                                    <h4>💡 Concepto Clave</h4>
                                    <p>El producto turístico incluye elementos tangibles (alojamiento, transporte, alimentación) e intangibles (emociones, recuerdos, conexiones personales). La magia del turismo comunitario está en equilibrar ambos aspectos.</p>
                                </div>
                            </div>

                            <div class="content-section">
                                <h2>La Analogía del Restaurante 🍽️</h2>
                                <p>Imagina tu destino turístico como un restaurante. Esta analogía nos ayuda a comprender mejor cómo funciona el turismo:</p>

                                <table class="content-table">
                                    <thead>
                                        <tr>
                                            <th>Restaurante</th>
                                            <th>Destino Turístico</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>Local y equipamiento</td>
                                            <td>Infraestructura del destino</td>
                                        </tr>
                                        <tr>
                                            <td>Menú y especialidad</td>
                                            <td>Posicionamiento y oferta turística</td>
                                        </tr>
                                        <tr>
                                            <td>Personal (cocinero, mesero)</td>
                                            <td>Actores del destino (guías, operadores)</td>
                                        </tr>
                                        <tr>
                                            <td>Comensal</td>
                                            <td>Visitante/Turista</td>
                                        </tr>
                                        <tr>
                                            <td>Plato de comida</td>
                                            <td>Producto turístico</td>
                                        </tr>
                                        <tr>
                                            <td>Experiencia de la cena</td>
                                            <td>Experiencia turística</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="example-card">
                                <span class="example-tag">Caso Ficticio</span>
                                <h4>🏞️ El Valle de las Mariposas - Santander</h4>
                                <p><strong>Situación:</strong> La comunidad del Valle de las Mariposas tenía hermosos paisajes y una rica tradición artesanal, pero los visitantes solo llegaban por unas horas y no gastaban dinero en la comunidad.</p>
                                <p><strong>Problema identificado:</strong> Tenían los "ingredientes" (atractivos) pero no un "plato preparado" (producto turístico).</p>
                                <p><strong>Solución:</strong> Diseñaron un producto llamado "Día de Mariposa" que incluye: bienvenida con agua de panela, recorrido guiado por senderos, taller de artesanías con madres de la comunidad, almuerzo con comida típica, y despedida con obsequio artesanal.</p>
                                <p><strong>Resultado:</strong> Los visitantes ahora permanecen 6-8 horas, gastan en promedio $150.000 COP por persona, y el 85% recomienda el destino.</p>
                            </div>

                            <div class="content-section">
                                <h2>Componentes del Producto Turístico</h2>
                                <p>Todo producto turístico debe considerar estos elementos:</p>
                                <ul>
                                    <li><strong>Atractivos:</strong> Lo que motiva la visita (naturaleza, cultura, historia)</li>
                                    <li><strong>Servicios:</strong> Alojamiento, alimentación, transporte, guiado</li>
                                    <li><strong>Actividades:</strong> Experiencias participativas que vive el visitante</li>
                                    <li><strong>Infraestructura:</strong> Vías, señalización, espacios públicos</li>
                                    <li><strong>Gestión:</strong> Organización, coordinación, comercialización</li>
                                </ul>
                            </div>

                            <div class="info-box warning">
                                <h4>⚠️ Error Común</h4>
                                <p>Muchas comunidades creen que con tener un atractivo natural o cultural ya tienen un producto turístico. ¡Error! Un árbol bonito no es un producto. Un recorrido interpretativo de 2 horas con guía certificado, punto de fotografía, y explicación ecológica SÍ es un producto.</p>
                            </div>
                        </div>

                        <div class="exercise-box">
                            <h3>📝 Ejercicio Práctico 1.1</h3>
                            <p><strong>Inventario de Tu Territorio</strong></p>
                            <ol class="exercise-steps">
                                <li>Lista todos los atractivos naturales y culturales de tu territorio (mínimo 5)</li>
                                <li>Para cada atractivo, identifica qué servicios existen actualmente (alojamiento, alimentación, etc.)</li>
                                <li>Evalúa del 1 al 5 el estado de cada componente (1=muy deficiente, 5=excelente)</li>
                                <li>Identifica las 3 brechas más críticas que debes cerrar</li>
                                <li>Documenta tus hallazgos en una tabla similar a la del módulo</li>
                            </ol>
                            <p><strong>Tiempo estimado:</strong> 2-3 horas</p>
                        </div>

                        <div class="content-navigation">
                            <button class="nav-btn prev" disabled>← Anterior</button>
                            <button class="nav-btn next" onclick="completeModule(1)">Completar Módulo →</button>
                        </div>
                    `
                },
                {
                    id: 2,
                    title: "Análisis del Destino Turístico",
                    status: "pending",
                    content: `
                        <div class="content-header">
                            <h1>Módulo 2: Análisis del Destino Turístico</h1>
                            <p>Conoce tu territorio a profundidad antes de diseñar cualquier producto</p>
                        </div>

                        <div class="content-body">
                            <div class="content-section">
                                <h2>🎯 Objetivos de Aprendizaje</h2>

        }

        // Render Module List
        function renderModuleList() {
            const moduleList = document.getElementById('moduleList');
            moduleList.innerHTML = '';

            courseData.modules.forEach((module, index) => {
                const li = document.createElement('li');
                li.className = `module-item ${currentModule === index ? 'active' : ''} ${completedModules.has(module.id) ? 'completed' : ''}`;
                li.onclick = () => loadModule(index);
                li.innerHTML = `
                    <span class="module-number">MÓDULO ${module.id.toString().padStart(2, '0')}</span>
                    <span class="module-name">${module.title}</span>
                    <span class="module-status">${completedModules.has(module.id) ? '✅ Completado' : '⏳ Pendiente'}</span>
                `;
                moduleList.appendChild(li);
            });
        }

        // Show Welcome Screen
        function showWelcome() {
            const content = document.getElementById('courseContent');
            content.innerHTML = `
                <div class="welcome-screen animate">
                    <h1>${courseData.welcome.title}</h1>
                    <p>${courseData.welcome.subtitle}</p>
                    <p style="max-width: 900px; margin: 0 auto 2rem;">${courseData.welcome.description}</p>

                    <div class="feature-grid">
                        ${courseData.welcome.features.map(f => `
                            <div class="feature-card">
                                <div class="icon">${f.icon}</div>
                                <h4>${f.title}</h4>
                                <p>${f.desc}</p>
                            </div>
                        `).join('')}
                    </div>

                    <button class="btn btn-primary" onclick="loadModule(0)" style="font-size: 1.2rem; padding: 15px 40px;">
                        Comenzar el Curso
                    </button>

                    <div style="margin-top: 3rem; padding: 2rem; background: linear-gradient(135deg, #fff5e6 0%, #ffe6cc 100%); border-radius: 12px; border: 2px solid var(--primary-color);">
                        <h3 style="color: var(--primary-color); margin-bottom: 1rem;">📋 Información Importante</h3>
                        <ul style="text-align: left; max-width: 700px; margin: 0 auto; line-height: 2;">
                            <li>✅ Curso 100% gratuito y de libre acceso</li>
                            <li>✅ No requiere inscripción ni registro</li>
                            <li>✅ Estudia a tu propio ritmo</li>
                            <li>✅ Todos los ejercicios son aplicables directamente en tu iniciativa</li>
                            <li>✅ Certificado disponible al completar los 11 módulos</li>
                        </ul>
                    </div>
                </div>
            `;
            currentModule = -1;
            renderModuleList();
        }

        // Load Module
        function loadModule(index) {
            if (index < 0 || index >= courseData.modules.length) return;

            currentModule = index;
            const content = document.getElementById('courseContent');
            content.innerHTML = courseData.modules[index].content;

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });

            renderModuleList();
        }

        // Complete Module
        function completeModule(moduleId) {
            completedModules.add(moduleId);
            updateProgress();
            renderModuleList();

            // Show completion message
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '✅ Completado';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;

                // Load next module
                if (moduleId < courseData.modules.length) {
                    loadModule(moduleId);
                }
            }, 1000);
        }

        // Update Progress
        function updateProgress() {
            const progress = Math.round((completedModules.size / courseData.modules.length) * 100);
            document.getElementById('progressPercent').textContent = progress;
            document.getElementById('sidebarProgress').style.width = `${progress}%`;
            document.getElementById('modulesCompleted').textContent = `${completedModules.size} de ${courseData.modules.length} módulos completados`;

            // Show completion badge if all modules completed
            if (completedModules.size === courseData.modules.length) {
                const badge = document.getElementById('courseCompletion');
                if (badge) {
                    badge.classList.add('show');
                }
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
