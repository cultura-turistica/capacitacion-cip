<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio - Marco Lógico (React)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .app-container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { border-bottom: 2px solid #3498db; padding-bottom: 15px; margin-bottom: 20px; }
        .module-btn { background-color: #3498db; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 10px; }
        .module-btn:hover { background-color: #2980b9; }
        .content-box { padding: 20px; background: #e8f4f8; border-radius: 6px; margin-top: 20px; }
        .nav-back { text-decoration: none; color: #e74c3c; font-weight: bold; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState } = React;

    function MarcoLogicoApp() {
        const [activeModule, setActiveModule] = useState(0);

        const modules = [
            { id: 0, title: "Introducción al Marco Lógico", content: "El Enfoque de Marco Lógico (EML) es una herramienta analítica, desarrollada para la planificación y gestión de proyectos orientados a objetivos. (Fuente: Manuales FONTUR). Aquí transformaremos la teoría en interactividad." },
            { id: 1, title: "Árbol de Problemas", content: "El primer paso es identificar el problema central, sus causas y sus efectos. En esta sección interactiva, el usuario arrastrará conceptos para armar su propio árbol." },
            { id: 2, title: "Árbol de Objetivos", content: "Convertir estados negativos (problemas) en estados positivos (objetivos). Aquí integraremos la visión de Cultura T: Pasar del recurso al producto turístico." }
        ];

        return (
            <div className="app-container">
                <a href="../laboratorio.html" className="nav-back">← Volver al Panel de Laboratorio</a>
                
                <div className="header">
                    <h2>📚 Módulo Interactivo: Formulación de Proyectos con Marco Lógico</h2>
                    <p><em>Arquitectura en React - Construcción en Proceso (El Profesor)</em></p>
                </div>
                
                <div className="controls">
                    {modules.map(mod => (
                        <button 
                            key={mod.id} 
                            className="module-btn" 
                            style={{ backgroundColor: activeModule === mod.id ? '#2c3e50' : '#3498db' }}
                            onClick={() => setActiveModule(mod.id)}
                        >
                            {mod.title}
                        </button>
                    ))}
                </div>

                <div className="content-box">
                    <h3>{modules[activeModule].title}</h3>
                    <p>{modules[activeModule].content}</p>
                    
                    <div style={{marginTop: '20px', padding: '15px', border: '1px dashed #7f8c8d', backgroundColor: '#fdfefe'}}>
                        <h4>🏗️ Zona de Componente Interactivo</h4>
                        <p style={{color: '#7f8c8d'}}><em>(Espacio reservado para el widget interactivo que se programará en la próxima fase)</em></p>
                    </div>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MarcoLogicoApp />);
</script>

</body>
</html>
